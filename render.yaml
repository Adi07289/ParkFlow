services:
  - type: web
    name: parkflow-backend
    runtime: node
    rootDir: backend
    plan: free
    region: ohio  # co-locate with the Neon Postgres (AWS US East 2 / Ohio)
    # NODE_ENV=production is set below, so force dev deps in for the build
    # (tsc / tsoa / ts-node are needed to compile and generate routes).
    buildCommand: npm install --include=dev && npm run build
    # migrate must succeed; seed is best-effort (it is idempotent) so a seed
    # hiccup never blocks the API from coming up.
    startCommand: npx prisma migrate deploy && (npx prisma db seed || echo "seed skipped") && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Postgres connection string. Use a provider whose free tier does NOT
      # expire (Neon / Supabase); Render's own free DB is deleted after 30 days.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set after the Vercel frontend is deployed, to its exact prod URL
      # e.g. https://parkflow-frontend.vercel.app  (used for CORS)
      - key: FRONTEND_URL
        sync: false
      # Upstash (or any) Redis connection string — required for login OTP
      # e.g. rediss://default:<pass>@<host>.upstash.io:6379
      - key: REDIS_URL
        sync: false
      # Transactional email for OTP delivery. NOTE: Render blocks outbound
      # SMTP ports 25/465/587 — use port 2525 (Brevo/Mailgun/SMTP2GO support it).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
